<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Atlas Wormhole Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --void: #111111;
    --ink: rgba(232, 236, 255, 0.96);
    --mute: rgba(190, 200, 240, 0.66);
    --faint: rgba(160, 172, 220, 0.42);
    --line: rgba(150, 170, 255, 0.18);
    --cyan: #36e6db;
    --panel: rgba(8, 9, 18, 0.7);
    --mono: "JetBrains Mono", "Courier New", ui-monospace, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--void);
    color: var(--ink);
    overflow: hidden;
    font: 11px/1.5 var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; transition: opacity .5s ease; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0; transition: opacity .8s ease; }
  .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 11px; font-weight: 600; letter-spacing: 2.2px; color: rgba(242, 246, 255, 0.97); transform: translate(-9999px, 0); will-change: transform;
    text-shadow: 0 0 12px rgba(2, 3, 10, 0.95), 0 0 4px rgba(2, 3, 10, 0.95), 0 1px 2px rgba(0, 0, 0, 0.9); }
  .lbl small { display: block; font-size: 8.5px; font-weight: 500; letter-spacing: 1.6px; color: rgba(190, 200, 238, 0.78); margin-top: 3px; }
  .lead { position: absolute; left: 0; top: 0; height: 1px; transform-origin: 0 50%; transform: translate(-9999px, 0); pointer-events: none;
    background: linear-gradient(90deg, rgba(200, 215, 255, 0), rgba(200, 215, 255, 0.5)); }
  .lbl.core { font-size: 12px; font-weight: 600; letter-spacing: 3px; }
  .hud { position: fixed; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .9s ease; letter-spacing: 2px; }
  .hud.tl { top: calc(20px + env(safe-area-inset-top, 0px)); left: 22px; font-size: 12px; font-weight: 600; color: var(--ink); }
  .hud.tl .dot { display: inline-block; width: 7px; height: 7px; border-radius: 99px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); margin-right: 9px; vertical-align: 1px; }
  .hud.tl .sub { color: var(--faint); }
  .hud.bl { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 22px; display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 11px; font-weight: 600; color: var(--faint); }
  .hud.bl span:first-child { color: var(--ink); }
  .panel {
    position: fixed; z-index: 10;
    top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px;
    display: flex; flex-direction: column; gap: 8px;
    width: min(360px, calc(100vw - 24px)); box-sizing: border-box;
    padding: 10px 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip {
    font: inherit; font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--mute); background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 10px; cursor: pointer;
  }
  .chip:hover { color: var(--ink); border-color: rgba(54, 230, 219, 0.45); }
  .chip:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .chip[aria-pressed="true"] { color: var(--cyan); border-color: rgba(54, 230, 219, 0.5); }
  .scrub { display: flex; align-items: center; gap: 8px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .scrub input { flex: 1; min-width: 0; accent-color: var(--cyan); }
  .scrub .t { width: 44px; }
  .phase { width: 64px; text-align: right; color: var(--mute); letter-spacing: 1.4px; text-transform: uppercase; }
  .note { color: var(--faint); letter-spacing: 0.3px; }
  .note b { color: var(--mute); font-weight: 500; }
  #fallback { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 24px; text-align: center; color: var(--mute); z-index: 20; background: var(--void); }
  @media (max-width: 560px) {
    .panel { left: 12px; right: 12px; width: auto; }
    .hud.tl { display: none; }
    .lbl small { display: none; }
    .lbl { font-size: 9.5px; letter-spacing: 1.6px; }
  }
</style>

<canvas id="gl" tabindex="0" aria-label="Wormhole prototype. Activate Explore the Atlas to begin the journey."></canvas>
<div id="labels" aria-hidden="true"></div>
<div class="hud tl" id="hudTop"><span class="dot"></span>NICHALAS BARNES <span class="sub">– ATLAS</span></div>
<div class="hud bl" id="hudBottom"><span>WORK</span><span>ABOUT</span><span>WRITING</span><span>CHANGELOG</span><span>TERMINAL</span><span>CONTACT</span></div>

<section class="panel" aria-label="Prototype controls">
  <div class="row">
    <button class="chip" id="bReplay" type="button">Replay</button>
    <button class="chip" id="bHome" type="button">Home</button>
    <button class="chip" id="bSlow" type="button" aria-pressed="false">Slow-mo</button>
    <button class="chip" id="bSound" type="button" aria-pressed="false">Sound off</button>
    <button class="chip" id="bReset" type="button" hidden>Reset view</button>
  </div>
  <label class="scrub" for="scrub"><span class="t" id="tLabel">0.00s</span><input id="scrub" type="range" min="0" max="3.8" step="0.01" value="0"><span class="phase" id="phase">home</span></label>
  <div class="note" id="note">Click <b>Explore the Atlas</b>. Click again or press Esc to skip. Drag the slider to inspect any frame.</div>
</section>
<div id="fallback" hidden><p></p></div>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const cv = $('#gl');
  const fail = (msg) => { const f = $('#fallback'); f.hidden = false; f.querySelector('p').textContent = msg; $('.panel').hidden = true; };
  const gl = cv.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
  if (!gl) { fail('This prototype needs WebGL2, which this browser did not provide.'); return; }
  if (!gl.getExtension('EXT_color_buffer_float')) { fail('This prototype needs floating-point render targets, which this browser did not provide.'); return; }

  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const DEG = Math.PI / 180;
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
  const bump = (t, c, w) => Math.exp(-(((t - c) / w) ** 2));
  const easeOutBack = (x, s = 1.4) => { x = clamp01(x) - 1; return 1 + (s + 1) * x * x * x + s * x * x; };

  const V = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
    rot: (v, k, ang) => {
      const c = Math.cos(ang), s = Math.sin(ang), kv = V.cross(k, v), d = V.dot(k, v) * (1 - c);
      return [v[0] * c + kv[0] * s + k[0] * d, v[1] * c + kv[1] * s + k[1] * d, v[2] * c + kv[2] * s + k[2] * d];
    },
    slerp: (a, b, t) => {
      const d = Math.min(1, Math.max(-1, V.dot(a, b))), th = Math.acos(d);
      if (th < 1e-6) return a.slice();
      const s = Math.sin(th);
      return V.add(V.mul(a, Math.sin((1 - t) * th) / s), V.mul(b, Math.sin(t * th) / s));
    },
  };
  const lookAt = (pos, target, up) => {
    const F = V.norm(V.sub(target, pos)), R = V.norm(V.cross(F, up)), U = V.cross(R, F);
    return { pos, F, R, U };
  };

  // ── Wormhole geometry (Ellis-type, after James, von Tunzelmann, Franklin & Thorne 2015) ──
  // Throat radius rho = 1. a = half-length of the cylindrical interior. M = lensing width.
  const WH = { a: 1.6, M: 0.34 };
  const rOf = (l) => { const x = Math.max(Math.abs(l) - WH.a, 0), xx = (2 * x) / (Math.PI * WH.M); return 1 + WH.M * (xx * Math.atan(xx) - 0.5 * Math.log(1 + xx * xx)); };
  const lFromR = (r) => { if (r <= 1) return 0; let lo = 0, hi = r + 6; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (rOf(m) < r) lo = m; else hi = m; } return (lo + hi) / 2; };

  // Journey timeline in seconds after the click.
  const J = { open0: 0.1, open1: 1.15, cross: 2.3, switch: 3.2, end: 3.8 };
  const OPEN_CHI = 7.5 * DEG;
  const L1 = lFromR(1 / Math.sin(OPEN_CHI));
  const LUT_W = 4096;

  // ── Shaders ──────────────────────────────────────────────────────────
  const HEAD = `#version 300 es
precision highp float;
precision highp sampler2D;
precision highp samplerCube;
`;
  const COMMON = `
#define PI 3.14159265359
uniform float uPx;
uniform float uTime;
uniform vec3 uBandN;
uniform samplerCube uNeb;
float hash13(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 hash32(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p); vec3 u = f * f * (3. - 2. * f);
  float a = hash13(i), b = hash13(i + vec3(1,0,0)), c = hash13(i + vec3(0,1,0)), d = hash13(i + vec3(1,1,0));
  float e = hash13(i + vec3(0,0,1)), g = hash13(i + vec3(1,0,1)), h = hash13(i + vec3(0,1,1)), k = hash13(i + vec3(1,1,1));
  return mix(mix(mix(a, b, u.x), mix(c, d, u.x), u.y), mix(mix(e, g, u.x), mix(h, k, u.x), u.y), u.z);
}
float fbm(vec3 p){ float s = 0., a = .5; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.02 + vec3(1.7, 9.2, 3.1); a *= .5; } return s; }
vec3 srgbToLin(vec3 c){ return pow(max(c, 0.), vec3(2.2)); }
vec3 linToSrgb(vec3 c){ return pow(max(c, 0.), vec3(1. / 2.2)); }
vec3 rotAxis(vec3 v, vec3 k, float a){ float c = cos(a), s = sin(a); return v * c + cross(k, v) * s + k * dot(k, v) * (1. - c); }
// Stars are sized from pxA, the angle one output pixel covers along the mapped
// direction, so they stay pin-sharp through any lens magnification. Where cells
// shrink below a few pixels the layer fades to its average glow instead of aliasing.
vec3 starLayer(vec3 d, float N, float seed, float bright, float pw, vec3 ca, vec3 cb, float sizeMul, float pxA, float mu){
  vec3 a = abs(d); vec2 uv; float face;
  if (a.x >= a.y && a.x >= a.z) { face = d.x > 0. ? 0. : 1.; uv = d.yz / a.x; }
  else if (a.y >= a.z) { face = d.y > 0. ? 2. : 3.; uv = d.xz / a.y; }
  else { face = d.z > 0. ? 4. : 5.; uv = d.xy / a.z; }
  vec2 g = uv * N; vec2 id0 = floor(g);
  float cellPx = clamp(pxA * N, 1e-5, 4.);
  float sig = cellPx * 0.6 * sizeMul;
  float resolve = 1. - smoothstep(0.22, 0.6, cellPx);
  vec3 col = vec3(0.);
  if (resolve > 0.) {
    for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
      vec2 id = id0 + vec2(float(i), float(j));
      vec3 h = hash32(id + vec2(face * 57.31 + seed, seed * 1.7));
      vec2 dv = g - (id + 0.12 + 0.76 * h.xy);
      float b = pow(h.z, pw);
      if (b < 0.004) continue;
      float r2 = dot(dv, dv) / (sig * sig);
      float k = exp(-r2);
      if (b > 0.2) k += exp(-r2 * 0.06) * 0.045 * smoothstep(0.2, 0.9, b);
      if (h.z > 0.9965) k += smoothstep(0.9965, 1.0, h.z) * 0.1 *
        (exp(-abs(dv.x) / (sig * 10.)) * exp(-dv.y * dv.y / (sig * sig * 0.2)) + exp(-abs(dv.y) / (sig * 10.)) * exp(-dv.x * dv.x / (sig * sig * 0.2)));
      col += mix(ca, cb, hash12(id + seed + face)) * b * k;
    }
    col *= resolve;
  }
  col += (ca + cb) * 0.5 * (3.14159 * sig * sig / (pw + 1.)) * (1. - resolve);
  return col * bright * mu;
}
// Lensing conserves surface brightness: a squeezed patch of sky shows more stars,
// each dimmer by the magnification. Brightening of magnified stars is capped.
float lensMu(float pxA){ float m = uPx / max(pxA, 1e-6); return min(m * m, 2.5); }
vec3 destSky(vec3 d, float pxA){
  float mu = lensMu(pxA);
  vec3 bg = vec3(0.0009, 0.0011, 0.0024);
  vec3 neb = texture(uNeb, d).rgb;
  float band = exp(-pow(dot(d, uBandN) * 3.0, 2.));
  vec3 s1 = starLayer(d, 36., 1.7, 3.0, 36., vec3(0.64, 0.76, 1.0), vec3(1.0, 0.83, 0.66), 1.0, pxA, mu);
  vec3 s2 = starLayer(d, 105., 5.3, 0.6 + band * 1.3, 22., vec3(0.72, 0.80, 1.0), vec3(0.98, 0.92, 0.86), 0.9, pxA, mu);
  vec3 s3 = starLayer(d, 290., 9.1, 0.16 + band * 0.9, 12., vec3(0.70, 0.78, 1.0), vec3(0.92, 0.92, 1.0), 0.85, pxA, mu);
  return bg + neb + s1 + s2 + s3;
}
vec3 originSky(vec3 d, float pxA){
  float mu = lensMu(pxA);
  vec3 dd = rotAxis(d, vec3(0.2, 0.9, 0.37), uTime * 0.006);
  vec3 s = starLayer(dd, 22., 11., 0.9, 2.2, vec3(0.39, 0.24, 0.78), vec3(0.31, 0.71, 0.86), 2.4, pxA, mu);
  s += starLayer(dd, 34., 23., 0.6, 3.5, vec3(0.78, 0.43, 0.63), vec3(0.24, 0.39, 0.86), 1.8, pxA, mu);
  return srgbToLin(vec3(0.0667) + min(s * 0.42, vec3(0.6)));
}
`;

  const VS_TRI = HEAD + `
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0., 1.); }`;

  const VS_QUAD = HEAD + `
layout(location=0) in vec2 aPos;
uniform vec4 uRect;
out vec2 vNdc;
void main(){ vec2 p = mix(uRect.xy, uRect.zw, aPos * 0.5 + 0.5); vNdc = p; gl_Position = vec4(p, 0., 1.); }`;

  const VS_GAL = HEAD + `
layout(location=0) in vec4 aA;
layout(location=1) in vec4 aB;
uniform mat4 uVP; uniform float uPxScale; uniform float uTime;
uniform vec3 uGC[8]; uniform vec3 uGE1[8]; uniform vec3 uGE2[8]; uniform vec3 uGN[8];
out vec3 vCol;
uniform vec3 uCamPos, uBhPos; uniform float uShadowR;
float shadowed(vec3 p){
  vec3 toB = uBhPos - uCamPos; float dB = length(toB);
  vec3 toP = p - uCamPos;
  if (dot(toP, toB) / dB <= dB) return 0.;
  float ang = acos(clamp(dot(normalize(toP), toB / dB), -1., 1.));
  return ang < asin(min(1., uShadowR / dB)) ? 1. : 0.;
}
void main(){
  int gi = int(aA.x + 0.5);
  float rho = aA.y;
  float th = aA.z + uTime * 0.05 / max(rho + 0.15, 0.2);
  vec3 p = uGC[gi] + (cos(th) * uGE1[gi] + sin(th) * uGE2[gi]) * rho + uGN[gi] * aA.w;
  vec4 clip = uVP * vec4(p, 1.);
  gl_Position = clip;
  float px = aB.a * uPxScale / max(clip.w, 0.01);
  float sz = max(px, 1.7);
  gl_PointSize = min(sz, 90.);
  vCol = clip.w > 0. ? aB.rgb * (px * px) / (sz * sz) * (1. - shadowed(p)) : vec3(0.);
}`;

  const VS_WEB = HEAD + `
layout(location=0) in vec4 aP;
layout(location=1) in vec4 aQ;
uniform mat4 uVP; uniform float uPxScale; uniform float uTime;
out vec3 vCol;
uniform vec3 uCamPos, uBhPos; uniform float uShadowR;
float shadowed(vec3 p){
  vec3 toB = uBhPos - uCamPos; float dB = length(toB);
  vec3 toP = p - uCamPos;
  if (dot(toP, toB) / dB <= dB) return 0.;
  float ang = acos(clamp(dot(normalize(toP), toB / dB), -1., 1.));
  return ang < asin(min(1., uShadowR / dB)) ? 1. : 0.;
}
void main(){
  vec4 clip = uVP * vec4(aP.xyz, 1.);
  gl_Position = clip;
  float travel = fract(uTime * aQ.y + aQ.x);
  float d = aP.w - travel;
  float pulse = exp(-d * d * 700.);
  float px = aQ.w * uPxScale / max(clip.w, 0.01);
  float sz = max(px, 1.6);
  gl_PointSize = min(sz, 40.);
  vCol = clip.w > 0. ? vec3(0.55, 0.70, 1.0) * (aQ.z + pulse * 1.6) * (px * px) / (sz * sz) * (1. - shadowed(aP.xyz)) : vec3(0.);
}`;

  const FS_PT = HEAD + `
in vec3 vCol; out vec4 o;
void main(){ vec2 c = gl_PointCoord * 2. - 1.; float r2 = dot(c, c); if (r2 > 1.) discard; o = vec4(vCol * exp(-r2 * 4.2), 1.); }`;

  const FS_LUT = HEAD + `
layout(location=0) out vec4 o;
layout(location=1) out vec4 o2;
uniform float uL, uA, uM, uW; uniform vec4 uMap;
#define PI 3.14159265359
float rOf(float l){ float x = max(abs(l) - uA, 0.); float xx = 2. * x / (PI * uM); return 1. + uM * (xx * atan(xx) - 0.5 * log(1. + xx * xx)); }
float drOf(float l){ float x = abs(l) - uA; if (x <= 0.) return 0.; float xx = 2. * x / (PI * uM); return (l > 0. ? 1. : -1.) * (2. / PI) * atan(xx); }
float chiFromU(float u){
  float c1 = uMap.y, c2 = uMap.z;
  if (u < 0.40) return c1 * u / 0.40;
  if (u < 0.75) return c1 + (c2 - c1) * (u - 0.40) / 0.35;
  float s = (u - 0.75) / 0.25; return c2 + (PI - c2) * s * s;
}
void main(){
  float u = (gl_FragCoord.x - 0.5) / (uW - 1.);
  float chi = chiFromU(u);
  float l = uL;
  float b = rOf(l) * sin(chi);
  float pl = -cos(chi);
  float phi = 0.;
  float esc = 0.;
  float b2 = b * b;
  float glow = 0.;
  for (int i = 0; i < 1100; i++) {
    float r = rOf(l);
    if (abs(l) > 40. && pl * l > 0.) { esc = 1.; break; }
    float h = max(min(0.3 * r, 0.045 * r * r / max(b, 0.02)), 0.002);
    float k1l = pl;                  float k1p = b2 * drOf(l) / (r * r * r);        float k1f = b / (r * r);
    float l2 = l + 0.5 * h * k1l;    float r2 = rOf(l2); float p2 = pl + 0.5 * h * k1p;
    float k2l = p2;                  float k2p = b2 * drOf(l2) / (r2 * r2 * r2);    float k2f = b / (r2 * r2);
    float l3 = l + 0.5 * h * k2l;    float r3 = rOf(l3); float p3 = pl + 0.5 * h * k2p;
    float k3l = p3;                  float k3p = b2 * drOf(l3) / (r3 * r3 * r3);    float k3f = b / (r3 * r3);
    float l4 = l + h * k3l;          float r4 = rOf(l4); float p4 = pl + h * k3p;
    float k4l = p4;                  float k4p = b2 * drOf(l4) / (r4 * r4 * r4);    float k4f = b / (r4 * r4);
    l += h * (k1l + 2. * k2l + 2. * k3l + k4l) / 6.;
    pl += h * (k1p + 2. * k2p + 2. * k3p + k4p) / 6.;
    phi += h * (k1f + 2. * k2f + 2. * k3f + k4f) / 6.;
    glow += h * b2 * exp(-pow(max(abs(l) - uA, 0.) / 0.45, 2.));
  }
  float rE = rOf(l);
  float phiInf = phi + asin(clamp(b / rE, 0., 1.));
  o = vec4(cos(phiInf), sin(phiInf), l < 0. ? 1. : 0., esc);
  o2 = vec4(1. - exp(-glow * 0.35), 0., 0., 1.);
}`;

  const FS_NEB = HEAD + COMMON + `
out vec4 o;
uniform int uFace; uniform float uSize;
vec3 faceDir(int f, vec2 uv){
  if (f == 0) return vec3(1., -uv.y, -uv.x);

    if (hard) { OR.T = T0.slice(); OR.D = 1; OR.az = OR.azD = 0; OR.el = 0; OR.lastInput = -1e9; }
  }
  const phaseName = (t) => (S.mode === 'home' ? 'home' : t < J.open0 ? 'ignite' : t < J.open1 ? 'opening' : t < J.cross ? 'plunge' : t < J.switch ? 'exit' : 'atlas');

  function start() {
    if (S.mode !== 'home') return;
    resetOrbit(true);
    hoverCta = false; drawPage(true);
    S.mode = 'journey'; S.t = 0; S.paused = false;
    if (soundOn) { if (stopSound) stopSound(); stopSound = playJourney(0, S.rate); }
    setHud(false);
  }
  function skip() {
    if (S.mode !== 'journey') return;
    S.t = J.switch; S.mode = 'atlas';
    if (stopSound) { stopSound(); stopSound = null; }
  }
  function goHome() {
    if (stopSound) { stopSound(); stopSound = null; }
    resetOrbit(true);
    S.mode = 'home'; S.t = 0; S.paused = false; cv.style.opacity = '1';
    setHud(false);
  }
  const NOTE_HOME = $('#note').innerHTML;
  const NOTE_ATLAS = 'Drag to orbit. Scroll or pinch to zoom toward the cursor. Double-click a galaxy or the black hole to fly in. <b>R</b> resets the view.';
  function setHud(on) {
    ['#hudTop', '#hudBottom'].forEach((s) => ($(s).style.opacity = on ? '1' : '0'));
    labelsEl.style.opacity = on ? '1' : '0';
    $('#bReset').hidden = !on;
    const want = on ? NOTE_ATLAS : NOTE_HOME;
    if ($('#note').innerHTML !== want) $('#note').innerHTML = want;
  }
  function atlasCam(t) {
    const back = params(t).back;
    const base = V.sub(V.mul(ARR.pos, ARR_K), T0);
    const baseLen = Math.hypot(base[0], base[1], base[2]);
    let dir = V.rot(V.norm(base), [0, 1, 0], OR.az);
    const side = V.norm(V.cross([0, 1, 0], dir));
    dir = V.norm(V.rot(dir, side, OR.el));
    let pos = V.add(OR.T, V.mul(dir, OR.D * baseLen + back));
    const r = Math.hypot(pos[0], pos[1], pos[2]);
    if (r < KEEP_OUT) pos = V.mul(pos, KEEP_OUT / r);
    return lookAt(pos, OR.T, [0, 1, 0]);
  }
  function toScreen(cam, p) {
    const q = V.sub(p, cam.pos), z = V.dot(q, cam.F);
    if (z < 0.2) return null;
    return [((V.dot(q, cam.R) / z / HOME.tanX) * 0.5 + 0.5) * cssW, (0.5 - (V.dot(q, cam.U) / z / HOME.tanY) * 0.5) * cssH];
  }
  function zoomAt(cx, cy, k, rate) {
    const cam = atlasCam(S.t);
    const nx = (cx / cssW) * 2 - 1, ny = 1 - (cy / cssH) * 2;
    const dir = V.norm(V.add(cam.F, V.add(V.mul(cam.R, nx * HOME.tanX), V.mul(cam.U, ny * HOME.tanY))));
    const newD = Math.min(ZMAX, Math.max(ZMIN, OR.Dd * k));
    const denom = V.dot(dir, cam.F);
    if (denom > 1e-3) {
      const P = V.add(cam.pos, V.mul(dir, V.dot(V.sub(OR.Td, cam.pos), cam.F) / denom));
      OR.Td = V.add(OR.Td, V.mul(V.sub(P, OR.Td), 1 - newD / OR.Dd));
    }
    if (newD > 1) OR.Td = V.add(OR.Td, V.mul(V.sub(T0, OR.Td), Math.min(1, (newD - 1) * 0.3)));
    const tl = Math.hypot(OR.Td[0], OR.Td[1], OR.Td[2]);
    if (tl > 11) OR.Td = V.mul(OR.Td, 11 / tl);
    OR.Dd = newD; OR.rate = rate; OR.lastInput = performance.now();
  }
  function focusAt(cx, cy) {
    const cam = atlasCam(S.t);
    let best = -1, bd = Math.max(48, cssW * 0.04);
    GAL.cPos.forEach((p, i) => { const sp = toScreen(cam, p); if (sp) { const d = Math.hypot(sp[0] - cx, sp[1] - cy); if (d < bd) { bd = d; best = i; } } });
    const sb = toScreen(cam, BH.pos);
    const q = V.sub(BH.pos, cam.pos), z = Math.max(0.1, V.dot(q, cam.F));
    const diskPx = (BH.outer / z / HOME.tanY) * cssH * 0.5;
    if (best >= 0) { OR.Td = GAL.cPos[best].slice(); OR.Dd = 0.26; OR.rate = 3.2; }
    else if (sb && Math.hypot(sb[0] - cx, sb[1] - cy) < Math.max(60, diskPx)) { OR.Td = T0.slice(); OR.Dd = 0.24; OR.rate = 3.2; }
    else { zoomAt(cx, cy, 0.55, 6); return; }
    OR.lastInput = performance.now();
  }

  function frame(nowMs) {
    const dt = Math.min(0.05, (nowMs - S.last) / 1000);
    S.last = nowMs;
    const time = nowMs / 1000;
    resize();
    if (!S.paused && S.mode !== 'home') {
      S.t += dt * S.rate;
      if (S.mode === 'journey' && S.t >= J.switch) S.mode = 'atlas';
    }
    if (S.mode === 'atlas') {
      if (!drag) {
        OR.azD += OR.vAz * dt; OR.elD = clampEl(OR.elD + OR.vEl * dt);
        const damp = Math.exp(-dt * 2.6); OR.vAz *= damp; OR.vEl *= damp;
        if (!S.paused && nowMs - OR.lastInput > 4000) OR.azD += dt * S.rate * 0.012;
      }
      const k = 1 - Math.exp(-dt * OR.rate);
      OR.az += (OR.azD - OR.az) * k; OR.el += (OR.elD - OR.el) * k;
      OR.D += (OR.Dd - OR.D) * k;
      OR.T = V.add(OR.T, V.mul(V.sub(OR.Td, OR.T), k));
    }
    if (S.mode === 'atlas' && S.t >= J.switch - 0.05) setHud(S.t > 3.3);
    if (S.mode === 'journey') {
      const P = params(S.t);
      renderAtlas(destRT, P.dest, RT_TAN, RT_TAN, time, false);
      updateLut(P.l);
      lensPass(P, time);
      bloomPass();
      composite(P, time, false);
    } else if (S.mode === 'atlas') {
      // Adaptive resolution: trade sharpness for smoothness when the GPU falls behind.
      ftAvg = ftAvg * 0.9 + dt * 1000 * 0.1; ftN++;
      const heavy = bhCoverage(atlasCam(Math.min(S.t, 9))) > 0.55;
      if (!heavy && atlasScale < 1) { atlasScale = 1; ftN = 0; ftAvg = 16.7; }
      else if (ftN > 45 && ftAvg > 19.5 && atlasScale > 0.5) { atlasScale = Math.max(0.5, atlasScale - 0.1); ftN = 0; ftAvg = 16.7; }
      else if (ftN > 180 && ftAvg < 17.4 && atlasScale < 1) { atlasScale = Math.min(1, atlasScale + 0.1); ftN = 0; ftAvg = 16.7; }
      const aw = Math.round(bufW * atlasScale), ah = Math.round(bufH * atlasScale);
      if (atlasScale >= 0.999) { freeTarget(hdrA); hdrA = null; }
      else if (!hdrA || hdrA.w !== aw || hdrA.h !== ah) { freeTarget(hdrA); hdrA = target(aw, ah); }
      const cam = atlasCam(Math.min(S.t, 9));
      renderAtlas(hdrA || hdr, cam, HOME.tanX, HOME.tanY, time, true);
      bloomPass(hdrA || hdr);
      composite(null, time, true, hdrA || hdr);
      placeLabels(cam, HOME.tanX, HOME.tanY);
    } else {
      const P = params(-1);
      lensPass(P, time);
      bloomPass();
      composite(P, time, false);
    }
    ui();
    window.__wh && window.__wh.frames++;
    requestAnimationFrame(frame);
  }

  // ── Controls ─────────────────────────────────────────────────────────
  const scrub = $('#scrub'), tLabel = $('#tLabel'), phaseEl = $('#phase');
  let scrubbing = false;
  function ui() {
    const t = S.mode === 'home' ? 0 : Math.min(S.t, J.end);
    if (!scrubbing) scrub.value = t.toFixed(2);
    tLabel.textContent = t.toFixed(2) + 's';
    phaseEl.textContent = phaseName(S.t);
  }
  scrub.addEventListener('input', () => {
    scrubbing = true;
    const t = parseFloat(scrub.value);
    if (stopSound) { stopSound(); stopSound = null; }
    if (t <= 0) { goHome(); scrubbing = false; return; }
    S.paused = true; S.t = t; resetOrbit(true);
    S.mode = t >= J.switch ? 'atlas' : 'journey';
    setHud(t > 3.3);
  });
  scrub.addEventListener('change', () => { scrubbing = false; });
  $('#bReplay').addEventListener('click', () => { goHome(); if (soundOn) audio(); setTimeout(start, 420); });
  $('#bHome').addEventListener('click', goHome);
  $('#bReset').addEventListener('click', () => resetOrbit(false));
  $('#bSlow').addEventListener('click', (e) => { S.rate = S.rate === 1 ? 0.25 : 1; e.currentTarget.setAttribute('aria-pressed', String(S.rate !== 1)); });
  $('#bSound').addEventListener('click', (e) => {
    soundOn = !soundOn;
    if (soundOn) audio(); else if (stopSound) { stopSound(); stopSound = null; }
    e.currentTarget.setAttribute('aria-pressed', String(soundOn));
    e.currentTarget.textContent = soundOn ? 'Sound on' : 'Sound off';
  });
  if (reduceMotion) { $('#note').innerHTML = 'Reduced motion is on, so the button fades straight to the Atlas. Press <b>Replay</b> to watch the full journey.'; }

  const inCta = (x, y) => layout && x >= layout.cta.x && x <= layout.cta.x + layout.cta.w && y >= layout.cta.y - 4 && y <= layout.cta.y + layout.cta.h + 4;
  let down = null, drag = null, pinch = null, lastTap = { t: 0, x: 0, y: 0 };
  const pointers = new Map();
  cv.addEventListener('pointerdown', (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    down = { x: e.clientX, y: e.clientY };
    if (S.mode !== 'atlas') return;
    cv.setPointerCapture(e.pointerId);
    OR.lastInput = performance.now();
    if (pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; drag = null;
    } else {
      drag = { lx: e.clientX, ly: e.clientY, lt: performance.now() };
      OR.vAz = OR.vEl = 0;
    }
  });
  cv.addEventListener('pointermove', (e) => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (S.mode === 'home') {
      const h = inCta(e.clientX, e.clientY);
      if (h !== hoverCta) { hoverCta = h; drawPage(true); }
      cv.style.cursor = h ? 'pointer' : 'default';
    } else if (S.mode === 'atlas') {
      if (pinch && pointers.size >= 2) {
        const [a, b] = [...pointers.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d > 0 && pinch.d > 0) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.d / d, 16);
        pinch.d = d;
      } else if (drag) {
        const now = performance.now(), dx = e.clientX - drag.lx, dy = e.clientY - drag.ly, dts = Math.max(8, now - drag.lt) / 1000;
        OR.azD -= dx * 0.004; OR.elD = clampEl(OR.elD + dy * 0.003);
        OR.vAz = OR.vAz * 0.4 + (-dx * 0.004 / dts) * 0.6; OR.vEl = OR.vEl * 0.4 + (dy * 0.003 / dts) * 0.6;
        drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = now;
        OR.rate = 18; OR.lastInput = now;
      }
      cv.style.cursor = drag ? 'grabbing' : 'grab';
    } else cv.style.cursor = 'pointer';
  });
  const release = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) {
      if (drag && performance.now() - drag.lt > 90) { OR.vAz = 0; OR.vEl = 0; }
      drag = null;
    }
  };
  cv.addEventListener('pointerup', (e) => {
    const moved = down ? Math.hypot(e.clientX - down.x, e.clientY - down.y) : 99;
    release(e);
    down = null;
    if (moved > 6) return;
    if (S.mode === 'home' && inCta(e.clientX, e.clientY)) {
      if (reduceMotion) { cv.style.opacity = '0'; setTimeout(() => { resetOrbit(true); S.mode = 'atlas'; S.t = J.end; S.paused = false; cv.style.opacity = '1'; setHud(true); }, 260); }
      else start();
    } else if (S.mode === 'journey') skip();
    else if (S.mode === 'atlas' && e.pointerType !== 'mouse') {
      const now = performance.now();
      if (now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) { focusAt(e.clientX, e.clientY); lastTap.t = 0; }
      else lastTap = { t: now, x: e.clientX, y: e.clientY };
    }
  });
  cv.addEventListener('pointercancel', release);
  cv.addEventListener('dblclick', (e) => { if (S.mode === 'atlas') focusAt(e.clientX, e.clientY); });
  cv.addEventListener('wheel', (e) => {
    if (S.mode !== 'atlas') return;
    e.preventDefault();
    const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    zoomAt(e.clientX, e.clientY, Math.exp(Math.max(-120, Math.min(120, dy)) * 0.0016), 12);
  }, { passive: false });
  cv.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && S.mode === 'home') { e.preventDefault(); start(); }
  });
  window.addEventListener('keydown', (e) => {
    if (S.mode !== 'atlas' || e.target instanceof HTMLInputElement) return;
    if (e.key === 'r' || e.key === 'R') resetOrbit(false);
    else if (e.key === '+' || e.key === '=') zoomAt(cssW / 2, cssH / 2, 0.7, 8);
    else if (e.key === '-' || e.key === '_') zoomAt(cssW / 2, cssH / 2, 1 / 0.7, 8);
  });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') skip(); });

  window.__wh = { start, skip, goHome, S, J, OR, get atlasScale() { return atlasScale; }, zoomAt, focusAt, resetOrbit, frames: 0, screenOf: (i) => toScreen(atlasCam(S.t), i < 0 ? BH.pos : GAL.cPos[i]), goto(t) { S.paused = true; S.t = t; S.mode = t <= 0 ? 'home' : t >= J.switch ? 'atlas' : 'journey'; setHud(t > 3.3); } };
  resize();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
