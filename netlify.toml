[build]
  command = "gatsby build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Preserve links to the former preview route.
[[redirects]]
  from = "/scroll"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/scroll/"
  to = "/"
  status = 301
  force = true
